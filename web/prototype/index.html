<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1420"><title>HuddleMind · Design preview</title>
<style>
:root{color-scheme:dark;--bg:#0b1420;--panel:#142131;--line:#29394c;--muted:#a5b5c6;--ink:#f3f6fa;--accent:#50dec8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.demo{background:#1d333a;color:#bdece4;text-align:center;font-size:12px;padding:8px 16px;letter-spacing:.03em}.shell{max-width:1280px;margin:auto}.sidebar{display:none}header{padding:24px 22px 0}.brand{font-weight:800;font-size:24px;letter-spacing:-1px}.brand span{color:var(--accent)}.dynasty{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;padding:12px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel);width:100%;text-align:left}.status{background:none;border:0;color:var(--muted);font-size:12px;padding:8px 0;min-height:44px;text-align:left}.dot{display:inline-block;width:7px;height:7px;border-radius:100%;background:var(--accent);margin-right:6px}.status strong{font-weight:500;color:var(--ink)}main{padding:24px 22px 110px;min-height:70vh}h1{font-size:32px;line-height:1.15;letter-spacing:-1px;margin:0 0 8px}h2{font-size:19px;margin:0}p{margin:6px 0;color:var(--muted)}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}.chip{background:#192a3c;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12px;color:#cfdae6}.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:20px;margin:0 0 16px}.hero{padding:24px;background:#172c39}.match{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:20px 0}.team{font-size:23px;font-weight:750;line-height:1.2}.team small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:7px}.versus{font-size:12px;color:var(--muted)}.badge{display:inline-block;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:650;background:#25423e;color:#90e6cf}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid .card{width:100%;text-align:left}.stat{display:block;font-size:32px;font-weight:750;letter-spacing:-1px;margin:8px 0 0}.label{font-size:13px;color:var(--muted)}.link{color:var(--accent);font-size:13px;background:none;border:0;padding:10px 0;min-height:44px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.rule{border-top:1px solid var(--line);margin:18px 0}.filters{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;margin:12px 0}.filters button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 15px;min-height:44px;white-space:nowrap}.filters button.selected{background:var(--accent);color:#082720;border-color:var(--accent);font-weight:700}.search{display:block;width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);margin:24px 0 8px}select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:10px;max-width:100%;margin-bottom:12px}.table{border:1px solid var(--line);border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:1fr 45px 45px;gap:8px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);padding:17px 14px;background:var(--panel);text-align:left;font-size:14px}.row:last-child{border-bottom:0}.row.head{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:10px 14px;background:#102030}.row small{display:block;color:var(--muted);font-size:12px}.rating{font-weight:750;color:var(--accent)}.empty{text-align:center;padding:30px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;background:#101e2deb;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5;backdrop-filter:blur(12px)}nav button{flex:1;min-height:54px;border:0;background:none;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}nav button.active{color:var(--accent)}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.fixture{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px}.week{font-size:11px;color:var(--muted)}.week b{display:block;font-size:23px;color:var(--ink)}.fixture strong{font-size:15px}.fixture small{display:block;color:var(--muted)}.score{text-align:right;font-weight:700}.details{display:grid;grid-template-columns:1fr auto;gap:16px;font-size:14px}.details dt{color:var(--muted)}.details dd{margin:0;text-align:right}.notice{font-size:13px;border-left:2px solid var(--accent);padding:8px 12px;margin:20px 0;color:var(--muted)}.back{background:none;border:0;color:var(--accent);padding:0;min-height:44px;margin-bottom:14px}.mini{font-size:12px;color:var(--muted)}footer{margin-top:30px;font-size:11px;color:var(--muted)}button.card:hover,.row:not(.head):hover{background:#1b3043}@media(min-width:850px){.shell{display:grid;grid-template-columns:230px 1fr}.sidebar{display:flex;flex-direction:column;padding:32px 22px;border-right:1px solid var(--line);min-height:100vh}.sidebar button{background:none;border:0;padding:15px;text-align:left;border-radius:9px;margin-top:7px;color:var(--muted)}.sidebar button.active{background:#173b40;color:var(--accent)}.sidebar .brand{margin-bottom:35px}header{padding:26px 36px 0;display:flex;align-items:center;justify-content:space-between;gap:20px}header .brand{display:none}.dynasty{width:240px;margin:0}.status{margin-left:auto}main{padding:35px 36px 70px}nav{display:none}.overview{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.overview .hero{height:100%}.overview .grid .card{margin:0}.overview .grid{align-content:stretch}.table{max-width:900px}h1{font-size:38px}.fixture{padding:22px}.sidebar .mini{margin-top:auto;padding-top:40px}}
</style></head><body><div class="demo">DESIGN PREVIEW · Sample data · No connection to your save</div><div class="shell"><aside class="sidebar"><div class="brand">Huddle<span>Mind</span></div><div id="side-nav"></div><p class="mini">Your program.<br>Your perspective.</p></aside><div><header><div class="brand">Huddle<span>Mind</span></div><button class="dynasty" onclick="go('dynasties')">Tulane Dynasty <span>⌄</span></button><button class="status" onclick="go('health')"><span class="dot"></span><strong>Bridge online</strong> &nbsp;·&nbsp; Snapshot 12 min ago ›</button></header><main id="main"></main></div></div><nav aria-label="Main navigation" id="nav"></nav>
<script>
// Fixed sample records keep this design preview independent from production data.
const players=[['Jordan Ellis','QB',82],['Marcus Reed','QB',77],['Cam Turner','QB',72],['Devin Brooks','HB',84],['Isaiah Cole','WR',81],['Noah Bennett','WR',76],['Andre Davis','CB',78],['Miles Carter','DT',80]];
const recruits=[['Evan Walker','QB',42,'Top 5',30],['Jayden Price','WR',87,'Top 8',25],['Cameron Hayes','CB',115,'Top 5',40],['Malik Foster','DT',164,'Open',20],['Owen Grant','LT',201,'Top 8',15]];
const games=[['1','Tulane','Duke','28–23','W'],['2','South Alabama','Tulane','','Next'],['3','Tulane','Kansas State','',''],['4','Southern Miss','Tulane','',''],['6','Tulane','Army','',''],['7','Memphis','Tulane','','']];
const icons={overview:'M3 10 12 3 21 10M5 9v12h5v-7h4v7h5V9',roster:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 4a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-4',schedule:'M4 5h16v16H4zM7 3v4M17 3v4M4 10h16',recruiting:'M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h5'};
let page='overview',filter='All',query='',sort='rating';
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(target){location.hash=target}function nav(){for(const id of ['nav','side-nav'])document.getElementById(id).innerHTML=Object.keys(icons).map(k=>`<button class="${page.startsWith(k)?'active':''}" ${page===k?'aria-current="page"':''} onclick="go('${k}')">${id==='nav'?`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[k]}"/></svg>`:''}${k[0].toUpperCase()+k.slice(1)}</button>`).join('')+(id==='side-nav'?`<button onclick="go('health')">Bridge status</button>`:'')}
function render(){page=location.hash.slice(1)||'overview';nav();const main=document.getElementById('main');
if(page==='overview')main.innerHTML=`<div class="eyebrow">Your dynasty, at a glance</div><h1 style="margin-top:10px">Tulane</h1><p>Coach Bakari Worthy</p><div class="chips"><span class="chip">2026 season</span><span class="chip">Week 2</span><span class="chip">Regular season</span></div><div class="overview"><section class="card hero"><div class="eyebrow">Next game · Week 2</div><div class="match"><div class="team">South Alabama<small>Away</small></div><span class="versus">AT</span><div class="team">Tulane<small>Home</small></div></div><div class="rule"></div><div class="label">Tulane season record</div><strong style="font-size:26px">1–0</strong><br><button class="link" onclick="go('schedule')">View schedule →</button></section><div class="grid"><button class="card" onclick="go('roster')"><span class="label">Roster</span><span class="stat">85</span><span class="label">players →</span></button><button class="card" onclick="go('recruiting')"><span class="label">Recruiting board</span><span class="stat">21</span><span class="label">targets →</span></button><div class="card"><span class="label">Recruiting hours</span><span class="stat">480</span><span class="label">total available</span></div><div class="card"><span class="label">Last result</span><div style="margin-top:12px;font-weight:700">Tulane 28<br>Duke 23</div><span class="badge" style="margin-top:8px">Win · Week 1</span></div></div></div><div class="section-title"><h2>Coming up</h2><button class="link" onclick="go('schedule')">All games →</button></div>${fixture(games[2])}<footer>Preview figures are illustrative. No live dynasty data is loaded.</footer>`;
else if(page==='roster'||page==='recruiting'){const roster=page==='roster';main.innerHTML=`<h1>${roster?'Roster':'Recruiting'}</h1><p>${roster?'85 players · 8 sample players shown':'21 targets · 5 sample recruits shown'}</p>${roster?'':`<div class="card" style="margin-top:20px"><div class="label">Recruiting hours</div><strong style="font-size:28px">480</strong> <span class="mini">total · sample snapshot</span></div>`}<input class="search" aria-label="Search ${roster?'players':'recruits'}" placeholder="Search ${roster?'players':'recruits'}…" oninput="query=this.value;list()"><div class="filters" aria-label="Position filters">${['All','QB','HB','WR','Defense'].map(x=>`<button onclick="filter='${x}';document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('selected',b.textContent===filter));list()" class="${x===filter?'selected':''}">${x}</button>`).join('')}</div>${roster?`<select aria-label="Sort roster" onchange="sort=this.value;list()"><option value="rating">Highest overall first</option><option value="name">Name A–Z</option></select>`:''}<div id="list"></div><footer>Sample names are fictional. Tap a row to explore details.</footer>`;list()}
else if(page.startsWith('player-')||page.startsWith('recruit-')){const r=page.startsWith('recruit-'),i=Number(page.split('-')[1]),item=(r?recruits:players)[i];if(!item){go('overview');return}main.innerHTML=`<button class="back" onclick="go('${r?'recruiting':'roster'}')">← ${r?'Recruiting board':'Roster'}</button><div class="eyebrow">${r?'Recruit profile':'Player profile'} · Sample</div><h1 style="margin-top:12px">${item[0]}</h1><p>${item[1]} · ${r?'Recruiting target':'Tulane'}</p><div class="card" style="margin-top:24px"><dl class="details">${r?`<dt>National rank</dt><dd>#${item[2]}</dd><dt>Recruiting stage</dt><dd>${item[3]}</dd><dt>Assigned hours</dt><dd>${item[4]}</dd><dt>Scholarship</dt><dd>Offered</dd><dt>Position rank</dt><dd>Unavailable</dd>`:`<dt>Overall rating</dt><dd class="rating">${item[2]}</dd><dt>Position</dt><dd>${item[1]}</dd><dt>Depth-chart placement</dt><dd>Unavailable</dd><dt>Injury information</dt><dd>Unavailable</dd>`}</dl></div><div class="notice">This preview demonstrates the layout. Missing information will stay labeled as unavailable rather than being shown as zero.</div>`}
else if(page==='schedule')main.innerHTML=`<h1>Schedule</h1><p>2026 season · Tulane</p><div class="chips"><span class="chip">Record 1–0</span><span class="chip">12 scheduled games</span></div>${games.map(fixture).join('')}<footer>Six sample fixtures shown. A gap in weeks is not assumed to be a confirmed bye.</footer>`;
else if(page==='health')main.innerHTML=`<button class="back" onclick="go('overview')">← Overview</button><h1>Bridge status</h1><p>Connection and snapshot freshness</p><div class="card" style="margin-top:24px"><span class="dot"></span><strong>Bridge online</strong><p class="mini">Sample heartbeat received 2 minutes ago</p><div class="rule"></div><dl class="details"><dt>Capture watcher</dt><dd>Running</dd><dt>Last snapshot</dt><dd>12 minutes ago</dd><dt>Last delivery</dt><dd>10 minutes ago</dd><dt>Waiting to send</dt><dd>0 observations</dd><dt>Reported errors</dt><dd>None</dd></dl></div><div class="notice">Online means the bridge has contacted the server recently. Your displayed snapshot only changes after a save is captured and delivered.</div><h2>When the bridge is offline</h2><p>Your last snapshot stays available. We’ll show its age and the last known bridge status.</p><footer>All status values on this page are simulated.</footer>`;
else if(page==='dynasties')main.innerHTML=`<button class="back" onclick="go('overview')">← Overview</button><h1>Your dynasties</h1><p>Select a dynasty to explore.</p><button class="card" style="margin-top:24px;width:100%;text-align:left" onclick="go('overview')"><strong>Tulane Dynasty</strong><p>2026 · Coach Bakari Worthy</p><span class="badge">Selected · Sample</span></button><div class="notice">Account sign-in and live dynasty selection will be connected after design review.</div>`;
else{go('overview');return}window.scrollTo(0,0)}
function fixture(g){return `<div class="card fixture"><div class="week">WEEK<b>${g[0]}</b></div><div><strong>${g[1]} at ${g[2]}</strong><small>${g[4]==='W'?'Final':g[4]==='Next'?'Next scheduled game':'Upcoming'}</small></div><div class="score">${g[3]||''}${g[4]?`<br><span class="badge">${g[4]}</span>`:''}</div></div>`}
function list(){const r=page==='roster';let data=(r?players:recruits).map((p,i)=>({p,i})).filter(({p})=>p[0].toLowerCase().includes(query.toLowerCase())&&(filter==='All'||p[1]===filter||filter==='Defense'&&['CB','DT','FS','SS','MLB'].includes(p[1])));if(r)data.sort((a,b)=>sort==='rating'?b.p[2]-a.p[2]:a.p[0].localeCompare(b.p[0]));document.getElementById('list').innerHTML=data.length?`<div class="table"><div class="row head"><span>${r?'PLAYER':'RECRUIT'}</span><span>POS</span><span>${r?'OVR':'RANK'}</span></div>${data.map(({p,i})=>`<button class="row" onclick="go('${r?'player':'recruit'}-${i}')"><span>${escapeText(p[0])}${r?'':`<small>${p[3]} · ${p[4]} hours</small>`}</span><span>${p[1]}</span><span class="rating">${r?'':'#'}${p[2]}</span></button>`).join('')}</div>`:`<div class="card empty">No ${r?'players':'recruits'} match your filters.<br><button class="link" onclick="filter='All';query='';render()">Clear filters</button></div>`}
window.addEventListener('hashchange',()=>{filter='All';query='';render()});render();
</script></body></html>

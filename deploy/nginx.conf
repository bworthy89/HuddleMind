# Initial HTTP virtual host. Certbot adds TLS and an HTTPS redirect after validation.
server {
    listen 80;
    listen [::]:80;
    server_name huddlemind-api.worthymedia.tech;

    client_max_body_size 2m;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
